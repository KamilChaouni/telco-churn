[project]
name = "telco-churn"
version = "0.1.0"
description = "Telco customer churn project (ESILV MLOps TP01-TP02)"
readme = "README.md"
authors = [
    { name = "Telco Churn team" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlflow>=3,<4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
telco-inspect = "telco_churn.dataset:main"
telco-train = "telco_churn.training:main"
telco-predict = "telco_churn.prediction:main"
telco-track = "telco_churn.tracking:main"
telco-registry-predict = "telco_churn.registry_inference:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.uv]
# Windows Smart App Control blocks SQLAlchemy's unsigned compiled extensions (needed by the
# MLflow server's SQLite store). Build SQLAlchemy from source as pure Python instead.
no-binary-package = ["sqlalchemy"]

[tool.uv.extra-build-variables]
sqlalchemy = { DISABLE_SQLALCHEMY_CEXT = "1" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E4 imports, E7 statements, E9 syntax/IO errors, F pyflakes (unused/undefined names), I isort
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["telco_churn"]
branch = true
